};

const PRESETS = [
  { id: "mach",     label: "แปรรูปในโรงงาน",          route: ["machining"] },
  { id: "sheet",    label: "งานแผ่น: ตัด laser → พับ", route: ["laser", "bend"] },

const ORDER_SRC = { excel: "Excel", cover: "Cover sheet", csv: "CSV", pdf: "PDF" };
const CUST_H = { Ethernal: 280, Pioneer: 210, Canon: 12 };
const FIELD_LABEL = { name: "ชื่อ Jig", due: "กำหนดส่ง", po: "PO / Job", qty: "จำนวน", owner: "ผู้รับผิดชอบ" };
const VIEWS = ["mine", "table", "kanban", "orders", "archive", "more"];
const VIEW_TITLE = { mine: "งานของฉัน", table: "ตาราง", kanban: "Kanban", orders: "สั่งซื้อ / จ้างทำ", archive: "คลังงาน", more: "เพิ่มเติม" };
const VIEW_KEY = "jigboard.view", MINE_OP_KEY = "jigboard.mineOp";
const MINE_SHOW = 3; // ชิ้นที่แสดงต่อกลุ่มก่อนกด "แสดงทั้งหมด"
const BACKUP_KEY = "jigboard.lastBackup";
const RECENT_DONE_DAYS = 7;
const TH_MON = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];

const clone = (o) => JSON.parse(JSON.stringify(o));
let S = { jigs: [], orders: [], logs: [] };
const ui = {
  view: "table", kb: "set", arch: "all", cust: "", q: "", open: new Set(), drawer: null, hideEmpty: false, prefJig: "", restore: null,
  conn: "connecting", readOnly: false, canWrite: null, canAdmin: false, stale: false,
  link: false, me: null, isAdmin: false, users: [], newPw: null,
  mineOp: "all", mineOpen: new Set(), uEdit: null, toolsOpen: false,
};

/* ---------- ข้อมูลส่วนกลาง (db ของ artifact) ----------
   jigs/{id}               ชุดงาน (ไม่รวมชิ้นส่วน)
   parts/{id}              ชิ้นส่วน + เส้นทาง (jigId, pos)
   orders/{id}             รายการสั่งซื้อ / จ้างทำ
   logs/{jigId}~{คนเขียน}   ประวัติของชุด แยกเอกสารตามคนเขียน จะได้ไม่เขียนทับกัน
   หน้าแก้ S ในหน่วยความจำ แล้ว commit() เทียบกับข้อมูลส่วนกลางและเขียนเฉพาะเอกสารที่เปลี่ยน */
const COLS = ["jigs", "parts", "orders", "logs"];
let db = null, writer = "s" + Math.random().toString(36).slice(2, 10);
const remote = { jigs: new Map(), parts: new Map(), orders: new Map(), logs: new Map() };
const loadedCols = new Set();
const outbox = new Map();   // path -> เนื้อเอกสาร หรือ null (ลบ) ที่ยังไม่ได้ส่ง
const inflight = new Map(); // path -> ที่กำลังส่ง
let pendingLog = [];
let flushing = false;

function stable(v) {
  return JSON.stringify(v, (k, x) => (x && typeof x === "object" && !Array.isArray(x) ? Object.fromEntries(Object.keys(x).sort().map((key) => [key, x[key]])) : x));
}
function effective(col) {
  const m = new Map(remote[col]);
  for (const src of [inflight, outbox]) for (const [path, body] of src) {
    const [c, id] = path.split("/");
    if (c === col) body === null ? m.delete(id) : m.set(id, body);
  }
  return m;
}
function rebuild() {
  const parts = [...effective("parts").values()];
  const jigs = [...effective("jigs").values()].map((d) => ({
    ...clone(d),
    parts: parts.filter((p) => p.jigId === d.id).sort((a, b) => (a.pos ?? 0) - (b.pos ?? 0))
      .map((p) => { const { jigId, pos, ...rest } = clone(p); return rest; }),
  })).sort((a, b) => (a.seq ?? 0) - (b.seq ?? 0) || a.id.localeCompare(b.id));
  const logs = [...effective("logs").values()].flatMap((d) => (d.entries || []).map((e) => ({ ...e, jigId: d.jigId })));
  S = { jigs, orders: [...effective("orders").values()].map(clone), logs: logs.concat(pendingLog) };
}
function docsOf(state) {
  const jigs = new Map(), parts = new Map(), orders = new Map();
  for (const j of state.jigs) {
    const { parts: ps, ...body } = j;
    jigs.set(j.id, body);
    ps.forEach((p, i) => parts.set(p.id, { ...p, jigId: j.id, pos: i }));
  }
  for (const o of state.orders) orders.set(o.id, o);
  return { jigs, parts, orders };
}
function enqueue(path, body) { outbox.delete(path); outbox.set(path, body); }
function queueLogs() {
  const byJig = new Map();
  for (const e of pendingLog) {
    if (!byJig.has(e.jigId)) byJig.set(e.jigId, []);
    byJig.get(e.jigId).push({ at: e.at, text: e.text, src: e.src, by: e.by || "" });
  }
  pendingLog = [];
  const logs = effective("logs");
  for (const [jigId, entries] of byJig) {
    const id = `${jigId}~${writer}`;
    enqueue(`logs/${id}`, { jigId, writer, entries: [...(logs.get(id)?.entries || []), ...entries] });
  }
}
async function writeDoc(path, body) {
  const ref = db.doc(path);
  const run = () => (body === null ? ref.delete() : ref.set(body));
  try { await run(); }
  catch (e) {
    if (e?.code !== "unavailable") throw e;
    await new Promise((r) => setTimeout(r, 800 + Math.random() * 1200));
    await run();
  }
}
async function flush() {
  if (flushing || !db) return;
  flushing = true; syncStatus();
  while (outbox.size) {
    const [path, body] = outbox.entries().next().value;
    outbox.delete(path); inflight.set(path, body);
    try { await writeDoc(path, body); }
    catch (e) { inflight.delete(path); onWriteError(e); break; }
    inflight.delete(path);
  }
  flushing = false; syncStatus();
}
function onWriteError(e) {
  outbox.clear();
  const code = e?.code;
  if (code === "not_signed_in") { showLogin("หมดเวลาการเข้าระบบ เข้าระบบอีกครั้ง"); return; }
  if (code === "invalid_argument" && ui.readOnly) toast("บัญชีนี้มีสิทธิ์ดูอย่างเดียว การแก้ไขไม่ถูกบันทึก");
  else if (code === "invalid_argument") toast(e.message || "บันทึกไม่ได้ ข้อมูลไม่ถูกต้อง");
  else toast("บันทึกไม่สำเร็จ เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ข้อมูลกลับไปเป็นค่าล่าสุดบนเซิร์ฟเวอร์");
  rebuild(); render(true);
}
function syncStatus() {
  const el = $("sync"); if (!el) return;
  const busy = outbox.size + inflight.size;
  const [cls, text] =
    ui.conn === "connecting" ? ["", "กำลังเชื่อมต่อเซิร์ฟเวอร์…"]
    : ui.conn === "offline" ? ["bad", "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้"]
    : ui.conn === "error" ? ["bad", "การเชื่อมต่อขาด โหลดหน้าใหม่"]
    : !ui.link ? ["bad", "สัญญาณหลุด กำลังต่อใหม่…"]
    : busy ? ["warn", "กำลังบันทึก…"]
    : ui.readOnly ? ["", "ดูอย่างเดียว"]
    : ["ok", "บันทึกบนเซิร์ฟเวอร์แล้ว"];
  el.className = "sync " + cls; el.textContent = text;
}
function applyReadOnly() { document.body.classList.toggle("ro", ui.readOnly); }

/* ---------- เซิร์ฟเวอร์โรงงาน ----------
   หน้าเว็บคุยกับ server.mjs ผ่าน /api: อ่านทั้งหมดทาง SSE (/api/stream) แล้วรับการเปลี่ยนแปลงสด ๆ
   เขียนทีละเอกสารด้วย PUT/DELETE /api/docs/<คอลเลกชัน>/<id> */
async function apiFetch(url, opts = {}) {
  let r;
  try { r = await fetch(url, { credentials: "same-origin", ...opts, headers: { "content-type": "application/json", ...(opts.headers || {}) } }); }
  catch (e) { throw { code: "unavailable", message: "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้" }; }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw { code: r.status === 401 ? "not_signed_in" : r.status >= 500 ? "unavailable" : data.code || "invalid_argument", message: data.message || "" };
  return data;
}
function makeServerDb() {
  const maps = { jigs: new Map(), parts: new Map(), orders: new Map(), logs: new Map() };
  const subs = { jigs: new Set(), parts: new Set(), orders: new Set(), logs: new Set() };
  let ready = false;
  const emit = (col) => {
    const docs = [...maps[col]].map(([id, body]) => ({ id, exists: true, data: () => body, metadata: {} }));
    for (const fn of subs[col]) fn({ docs, size: docs.length, empty: !docs.length, metadata: {} });
  };
  const es = new EventSource("/api/stream");
  es.addEventListener("snapshot", (e) => {
    const d = JSON.parse(e.data);
    for (const col of Object.keys(maps)) maps[col] = new Map(Object.entries(d[col] || {}));
    ready = true; ui.link = true;
    for (const col of Object.keys(maps)) emit(col);
  });

    <td data-label="กำหนดส่ง"><div class="mono small">${fmtD(j.due)}</div>${dueBadge(j)}</td>
    <td data-label="ของที่สั่ง">${kit(j.id)}</td>

    <td class="mono small muted" data-label="อัปเดตล่าสุด">${j.updated ? fmtDT(j.updated) : "—"}</td>

      <td colspan="4" class="wide">${partActions(j, p, "row")}</td></tr>`).join("");
    h += std.map((o) => `<tr class="sub">
      <td class="small wide"><span class="kind stdpart">Std part</span> ${esc(o.what)}</td>
      <td colspan="4" class="small muted wide">${esc(o.supplier || "—")} · ${esc(o.status)}${o.due ? ` · กำหนดรับ ${fmtD(o.due)}` : ""}</td>

  }
  return h;
}

// ช่องที่ว่างหดเป็นแถบแคบ แต่ยังเป็นที่วางการ์ดได้ (data-stage เดิม)
function lane(id, pill, sub, count, body, empty) {
  if (ui.hideEmpty && !count) return "";
  return `<section class="lane${count ? "" : " empty"}" data-stage="${id}" aria-label="${esc(pill.replace(/<[^>]+>/g, ""))} ${count}">
    <div class="lane-h"><div>${pill}${sub ? `<small>${esc(sub)}</small>` : ""}</div><span class="c">${count}</span></div>
    <div class="lane-body">${count ? body : `<div class="drop-hint">${empty}</div>`}</div></section>`;
}
function setLanes(js) {
  return STAGES.map((s) => {
    const cards = js.filter((j) => j.stage === s.id).sort(s.id === "done" ? (a, b) => (b.closed?.at || "").localeCompare(a.closed?.at || "") : byDue);
    return lane(s.id, `<span class="pill" style="--h:${s.h}">${esc(s.label)}</span>`, s.sub, cards.length, cards.map(setCard).join(""), "วางการ์ดที่นี่");
  }).join("");
}
function setCard(j) {
  const pend = ordersOf(j.id).filter(isPending);
  const next = j.closed ? null : STAGES[SIDX[j.stage] + 1];
  const showReady = !j.closed && (j.stage === "prep" || (!pastPrep(j) && readiness(j).total) || (pastPrep(j) && j.parts.some((p) => !partReady(p))));
  const menu = j.closed || ui.readOnly ? "" : `<button class="menu-btn" type="button" data-act="cardmenu" data-id="${j.id}" aria-haspopup="menu" aria-expanded="false" aria-label="เมนูของ ${esc(j.jigNo)}"><svg class="ico" aria-hidden="true"><use href="#i-more"/></svg></button>`;
  return `<article class="card" draggable="${!ui.readOnly && !j.closed}" data-id="${j.id}">
    <div class="card-top"><button class="open-btn" data-act="open" data-id="${j.id}"><span class="no">${esc(j.jigNo)}</span></button>${menu}</div>
    <div class="cust">${esc(j.customer)}${j.name ? " · " + esc(j.name) : ""}${j.parts.length > 1 ? ` · ${j.parts.length} ชิ้นส่วน` : ""}</div>
    ${showReady ? readyHtml(j) : ""}
    <div class="card-meta">${dueBadge(j)}${ageBadge(j)}${!j.closed && pend.length ? `<span class="badge ${pend.some(isLate) ? "bad" : "warn"}">รอของ ${pend.length}</span>` : ""}${j.issue && !j.closed ? `<span class="badge bad">${esc(j.issue)}</span>` : ""}</div>
    <div class="card-foot"><span class="mono small muted">${fmtD(j.due)}</span>${next ? `<button class="next-btn" data-act="next" data-id="${j.id}" title="ย้ายไป ${esc(next.label)}">${esc(next.label)}${next.id === "done" ? "…" : " →"}</button>` : ""}</div>
  </article>`;
}
function partLanes(js) {
  const items = js.filter((j) => j.stage === "prep").flatMap((j) => j.parts.map((p) => ({ j, p, s: curStep(p) })));
  const cols = Object.entries(OPS).map(([op, o]) => {
    const list = items.filter((x) => x.s && x.s.op === op).sort((a, b) => (b.s.state === "doing") - (a.s.state === "doing") || byDue(a.j, b.j));
    const doing = list.filter((x) => x.s.state === "doing").length;
    return lane(op, `<span class="pill" style="--h:${o.h}">${esc(o.label)}</span>`, list.length ? `กำลังทำ ${doing} · รอ ${list.length - doing}` : o.sub, list.length, list.map(partCard).join(""), "ไม่มีชิ้นส่วนรอขั้นนี้");
  });
  const ready = items.filter((x) => !x.s);
  cols.push(lane("ready-parts", `<span class="pill" style="--h:150">พร้อมประกอบ</span>`, "รอชิ้นอื่นในชุดให้ครบ", ready.length, ready.map(partCard).join(""), "ยังไม่มี"));
  return cols.join("");
}
function partCard({ j, p, s }) {
  const idx = s ? p.steps.indexOf(s) : -1;
  const next = s && p.steps[idx + 1];
  return `<article class="card pcard">
    <div class="card-top"><span class="no">${esc(p.name)}</span></div>
    <button class="open-btn cust" data-act="open" data-id="${j.id}">ชุด ${esc(j.jigNo)} · ${esc(j.customer)}</button>
    <div class="state">${partStateHtml(p)}${next ? ` · ถัดไป ${esc(OPS[next.op].label)}` : ""}</div>
    <div class="card-meta">${dueBadge(j)}</div>
    ${partActions(j, p, "row")}
  </article>`;
}

let xlsxP;
function loadScript(src) {

    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = () => { s.remove(); rej(new Error("load")); };
    document.head.appendChild(s);
  });
}
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return (xlsxP ||= loadScript("/vendor/xlsx.full.min.js")
    .catch(() => loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"))
    .then(() => window.XLSX)
    .catch((e) => { xlsxP = null; throw e; }));
}
// เบราว์เซอร์ปกติดาวน์โหลดไฟล์ได้เอง
function getDownloads() {
  return Promise.resolve({
    async save({ filename, data }) {
      const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data]));
      const a = Object.assign(document.createElement("a"), { href: url, download: filename });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      return { status: "saved" };
    },
  });
}

function fromSheets(X, wb) {
  const need = ["ชุดงาน", "ชิ้นส่วน", "สั่งซื้อ", "ประวัติ"];
  if (!need.every((n) => wb.Sheets[n])) throw new Error("ไฟล์นี้ไม่ใช่ไฟล์สำรองของบอร์ดงาน Jig ต้องมีชีต ชุดงาน, ชิ้นส่วน, สั่งซื้อ และประวัติ");
  const rows = (n) => X.utils.sheet_to_json(wb.Sheets[n], { defval: "", raw: false });
  const str = (v) => (v === "" || v == null ? null : String(v).trim());
  const jigs = rows("ชุดงาน").filter((r) => str(r["รหัส"]) && str(r["Jig No"])).map((r) => ({
    id: str(r["รหัส"]), jigNo: str(r["Jig No"]), name: str(r["ชื่อ"]), customer: str(r["ลูกค้า"]) || "ไม่ระบุลูกค้า", po: str(r["PO / Job"]),
    qty: str(r["จำนวน"]) ? Number(r["จำนวน"]) || null : null, owner: str(r["ผู้รับผิดชอบ"]), due: str(r["กำหนดส่ง"]),
    stage: SIDX[str(r["ขั้นงาน_code"])] != null ? str(r["ขั้นงาน_code"]) : "drawing", issue: str(r["ปัญหา / รอ"]) || "", note: str(r["หมายเหตุ"]) || "",
    closed: ["done", "lost"].includes(str(r["ปิดงาน_code"])) ? { kind: str(r["ปิดงาน_code"]), at: str(r["ปิดเมื่อ"]), reason: str(r["เหตุผลที่ปิด"]), from: str(r["ปิดที่ขั้น_code"]) } : null,
    stageAt: str(r["เข้าขั้นนี้เมื่อ"]), updated: str(r["อัปเดตล่าสุด"]), parts: [],
  }));
  if (!jigs.length) throw new Error("ไม่พบงานในชีต ชุดงาน");
  const byId = new Map(jigs.map((j) => [j.id, j]));
  const parts = new Map();
  for (const r of rows("ชิ้นส่วน")) {
    const j = byId.get(str(r["รหัสชุด"])), op = str(r["ขั้น_code"]);
    if (!j || !OPS[op] || !str(r["รหัสชิ้น"])) continue;
    let p = parts.get(str(r["รหัสชิ้น"]));
    if (!p) { p = { id: str(r["รหัสชิ้น"]), name: str(r["ชิ้นส่วน"]) || str(r["รหัสชิ้น"]), spec: str(r["สเปก"]) || "", steps: [] }; parts.set(p.id, p); j.parts.push(p); }
    const st = str(r["สถานะ_code"]);
    const step = { n: Number(r["ลำดับขั้น"]) || p.steps.length + 1, op, state: STEP_STATE[st] ? st : "wait", start: str(r["เริ่ม"]), end: str(r["เสร็จ"]) };
    if (str(r["ร้าน"])) step.shop = str(r["ร้าน"]);
    if (str(r["กำหนดรับ"])) step.due = str(r["กำหนดรับ"]);
    if (str(r["ปิดอัตโนมัติ"])) step.auto = true;
    p.steps.push(step);
  }
  for (const p of parts.values()) { p.steps.sort((a, b) => a.n - b.n); p.steps.forEach((s) => delete s.n); }
  const orders = rows("สั่งซื้อ").filter((r) => byId.has(str(r["รหัสชุด"])) && str(r["รายการ"])).map((r) => ({
    id: str(r["รหัส"]) || "O" + Math.random().toString(36).slice(2, 8), jigId: str(r["รหัสชุด"]), kind: KINDS[str(r["ประเภท_code"])] ? str(r["ประเภท_code"]) : "material",
    what: str(r["รายการ"]), qty: str(r["จำนวน"]) ? Math.max(1, Math.round(Number(r["จำนวน"])) || 1) : null, note: str(r["หมายเหตุ"]) || "",
    supplier: str(r["Supplier"]) || "", ordered: str(r["สั่งเมื่อ"]), due: str(r["กำหนดรับ"]), received: str(r["รับจริง"]),
    status: ORDER_STATUS.includes(str(r["สถานะ"])) ? str(r["สถานะ"]) : "ยังไม่สั่ง", src: str(r["ที่มา"]) || "",
  }));
  const logs = rows("ประวัติ").filter((r) => byId.has(str(r["รหัสชุด"])) && str(r["เวลา"])).map((r) => ({
    jigId: str(r["รหัสชุด"]), at: str(r["เวลา"]), text: str(r["รายการ"]) || "", src: str(r["ที่มา"]) || "", by: str(r["โดย"]) || "",
  }));
  return { jigs, orders, logs };
}

async function doBackup() {

    const wb = X.utils.book_new();
    for (const [name, data] of Object.entries(toSheets())) {
      const ws = X.utils.json_to_sheet(data.length ? data : [{}]);
      const keys = data.length ? Object.keys(data[0]) : [];
      ws["!cols"] = keys.map((k) => ({ wch: Math.min(40, Math.max(k.length + 2, ...data.slice(0, 200).map((r) => String(r[k] ?? "").length + 1))) }));
      X.utils.book_append_sheet(wb, ws, name);
    }
    const buf = X.write(wb, { bookType: "xlsx", type: "array" });
    const filename = `บอร์ดงาน-Jig-สำรอง-${isoToday()}.xlsx`;
    await dl.save({ filename, data: new Blob([buf]) });
    try { localStorage.setItem(BACKUP_KEY, nowIso()); } catch (e) {}
    st.className = "bk-status ok"; st.textContent = `บันทึกไฟล์ ${filename} แล้ว`;

  } catch (err) {

  }
}

const SCROLLERS = "#drawer .dr-body, #board, #board .lane-body, .mine-chips, .view .scroll-x";
function scrollKey(el) {
  // ใช้หัวข้อที่แสดงอยู่จริง: เปิดแผงของชุดอื่นต้องเริ่มบนสุด ไม่ใช่ตำแหน่งของชุดเดิม
  if (el.matches(".dr-body")) return `dr:${$("drawer").dataset.kind || ""}:${$("drawer").querySelector(".dr-head h2, h2")?.textContent || ""}`;
  if (el.id === "board") return `board:${ui.kb}`;
  if (el.matches(".lane-body")) return `lane:${ui.kb}:${el.closest(".lane")?.dataset.stage}`;
  const view = el.closest(".view");
  return `${view?.id}:${el.className}:${view ? [...view.querySelectorAll("." + el.classList[0])].indexOf(el) : 0}`;
}
function keepScroll(draw) {
  const saved = new Map();
  for (const el of document.querySelectorAll(SCROLLERS)) if (el.scrollTop || el.scrollLeft) saved.set(scrollKey(el), [el.scrollTop, el.scrollLeft]);
  const focusKey = (() => { const a = document.activeElement; return a?.dataset?.act ? [a.dataset.act, a.dataset.id, a.dataset.pid] : null; })();
  draw();
  for (const el of document.querySelectorAll(SCROLLERS)) {
    const s = saved.get(scrollKey(el));
    if (s) { el.scrollTop = s[0]; el.scrollLeft = s[1]; }
  }
  // ปุ่มที่กดถูกวาดใหม่: ย้าย focus ไปปุ่มเดียวกันโดยไม่เลื่อนจอ (สำหรับคนใช้คีย์บอร์ด)
  if (focusKey && (!document.activeElement || document.activeElement === document.body)) {
    const [act, id, pid] = focusKey;
    const sel = `[data-act="${act}"]${id ? `[data-id="${CSS.escape(id)}"]` : ""}${pid ? `[data-pid="${CSS.escape(pid)}"]` : ""}`;
    document.querySelector(sel)?.focus({ preventScroll: true });

}

// เปิดแผง: focus ไปที่หัวข้อ · ปิดแผง: คืน focus ให้ปุ่มที่กดเปิด
let drawerOpener = null;
function drawerStep(before = document.activeElement) {

    requestAnimationFrame(() => { if (!dr.contains(document.activeElement)) $("dr-title")?.focus(); });
  } else if (was && !now) {

function trapFocus(e, box) {
  const f = [...box.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')].filter((x) => !x.disabled && x.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && (document.activeElement === first || !box.contains(document.activeElement))) { last.focus(); e.preventDefault(); }

      { cls: "primary", html: `<span class="choice" style="padding:0"><span>ปิด ${n} ชิ้นเป็นเสร็จ แล้วเลื่อน</span><small>ลงเวลาเสร็จเป็นตอนนี้ · ติดป้าย “อัตโนมัติ”</small></span>`, fn: () => closeAndMove(j.id, to, how) },
    ],

}
// เขียน step เองโดยไม่แตะ partAdvance: ขั้นที่ปิดจากการเลื่อนชุดติด auto: true
function closeRemainingSteps(j) {
  const at = nowIso(), snap = [];
  for (const p of j.parts) {
    if (partReady(p)) continue;
    snap.push([p.id, clone(p.steps)]);
    const names = [];
    for (const s of p.steps) {
      if (s.state === "done") continue;
      if (!s.start) s.start = at;
      s.state = "done"; s.end = at; s.auto = true;
      names.push(OPS[s.op].label);
    }
    log(j.id, `${p.name}: ${names.join(", ")} ปิดพร้อมเลื่อนขั้น (อัตโนมัติ)`);
  }
  return snap;
}
function closeAndMove(id, to, how) {
  const j = jigById(id); if (!j) return;
  const from = j.stage;
  const snap = closeRemainingSteps(j);
  setJigStage(j, to, how);
  commit(`${j.jigNo} → ${stage(to).label} · ปิดชิ้นที่เหลือ ${snap.length} ชิ้น`, { label: "เลิกทำ", fn: () => {
    const x = jigById(id); if (!x) return;
    for (const [pid, steps] of snap) { const p = partOf(x, pid); if (p) p.steps = steps; }
    log(x.id, `เลิกทำ: เปิดชิ้นส่วน ${snap.length} ชิ้นกลับเป็นสถานะเดิม`);
    setJigStage(x, from);
    commit(`${x.jigNo} กลับมาที่ขั้น ${stage(from).label}`);
  } });
}
// ปิดงาน (ไม่ได้งาน / ยกเลิก): เลือกเหตุผลครบ 5 ข้อตาม LOST_REASONS

// เสร็จทั้งชุด: ทุกชิ้นที่ยังไม่พร้อมอยู่ขั้นเดียวกัน
function batchInfo(j) {
  const left = j.parts.filter((p) => !partReady(p));
  if (left.length < 2) return null;
  const op = curStep(left[0]).op;
  return left.every((p) => curStep(p).op === op) ? { op, parts: left } : null;
}
// ข้อความปุ่มระดับชุด: งานนอกที่ยังไม่ส่งต้องผ่านหน้าส่ง (ใส่ร้าน/กำหนดรับ) ไม่ใช่กดเสร็จรวด
function batchLabel(b) {
  const o = OPS[b.op], n = b.parts.length;
  if (o.ext) return b.parts.some((p) => curStep(p).state === "wait") ? `${o.send} ${n} ชิ้น…` : `${o.recv} ทั้ง ${n} ชิ้น…`;
  return `${o.label} เสร็จทั้ง ${n} ชิ้น…`;
}
function askBatch(j) {
  const b = batchInfo(j); if (!b) return;
  if (OPS[b.op].ext && b.parts.some((p) => curStep(p).state === "wait")) return askSend(j, b.parts.find((p) => curStep(p).state === "wait"));
  const lbl = OPS[b.op].label, n = b.parts.length;
  const waiting = b.parts.filter((p) => curStep(p).state === "wait").length;
  openDialog({
    title: OPS[b.op].ext ? `${OPS[b.op].recv} ทั้ง ${n} ชิ้น?` : `${lbl} เสร็จทั้ง ${n} ชิ้น?`,
    lead: `ชุด <b class="mono">${esc(j.jigNo)}</b> · ลงเวลาเสร็จเป็นตอนนี้ทุกชิ้น${waiting ? ` · ${waiting} ชิ้นที่ยังไม่เริ่มจะลงเวลาเริ่มเป็นตอนนี้ด้วย` : ""}`,
    body: `<ul class="dlg-list">${b.parts.map((p) => `<li><b class="mono">${esc(p.name)}</b>${partStateHtml(p)}</li>`).join("")}</ul>`,
    actions: [CANCEL(), { label: `ยืนยัน เสร็จทั้ง ${n} ชิ้น`, cls: "primary", fn: () => {
      const x = jigById(j.id); if (!x) return;
      const done = [];
      for (const p0 of b.parts) {
        const p = partOf(x, p0.id), s = p && curStep(p);
        if (!s || s.op !== b.op) continue;
        let k = 0;
        while (s.state !== "done" && k < 3) { partAdvance(x, p); k++; }
        done.push([p.id, k]);
      }
      commit(readyMsg(x) || `${x.jigNo}: ${lbl} เสร็จ ${done.length} ชิ้น`, { label: "เลิกทำ", fn: () => {
        const y = jigById(x.id); if (!y) return;
        for (const [pid, k] of done) { const p = partOf(y, pid); if (p) for (let i = 0; i < k; i++) partBack(y, p); }
        commit(`${y.jigNo}: เลิกทำ ${lbl} ${done.length} ชิ้น`);
      } });
    } }],
  });
}

/* ---------- งานนอก: ส่ง (ร้าน + กำหนดรับ) / แก้ไข ---------- */
function knownShops() {
  const shops = new Set();
  for (const j of S.jigs) for (const p of j.parts) for (const s of p.steps) if (s.shop) shops.add(s.shop);
  for (const o of S.orders) if (o.supplier) shops.add(o.supplier);
  return [...shops].sort((a, b) => a.localeCompare(b, "th"));
}
function shopFields(shop, due) {

      <label>ร้าน / Supplier<input class="field" id="sd-shop" list="sd-shops" autocomplete="off" value="${esc(shop || "")}" placeholder="เช่น ร้านชุบ ABC"></label>

// ส่งทีละงาน: เลือกชิ้นในชุดเดียวกันที่รอขั้นนี้ ส่งพร้อมกันได้ในครั้งเดียว
function askSend(j, p0, prefill = {}) {
  const s0 = curStep(p0); if (!s0) return;
  const o = OPS[s0.op];
  const same = j.parts.filter((p) => { const s = curStep(p); return s && s.op === s0.op && s.state === "wait"; });
  const picked = new Set(prefill.ids || same.map((p) => p.id));
  openDialog({
    title: `${o.send} · ${j.jigNo}`,
    lead: "บันทึกร้านและวันที่ควรได้ของคืน ระบบจะเตือนเมื่อเลยกำหนด · วันส่งลงเป็นวันนี้ให้เอง",
    body: shopFields(prefill.shop, prefill.due ?? isoPlus(7)) + (same.length > 1
      ? `<fieldset class="radio-list" style="margin-top:12px"><legend>ชิ้นที่ส่งรอบนี้</legend>${same.map((p) => `<label><input type="checkbox" name="sd-p" value="${esc(p.id)}"${picked.has(p.id) ? " checked" : ""}><span class="mono">${esc(p.name)}</span></label>`).join("")}</fieldset>`
      : ""),
    actions: [CANCEL(), { label: "บันทึกการส่ง", cls: "primary", fn: (d) => {
      const shop = d.querySelector("#sd-shop").value.trim(), due = d.querySelector("#sd-due").value || null;
      const ids = same.length > 1 ? [...d.querySelectorAll('input[name="sd-p"]:checked')].map((x) => x.value) : [p0.id];
      if (!shop || !ids.length) { toast(!shop ? "ใส่ชื่อร้านก่อนบันทึกการส่ง" : "เลือกอย่างน้อย 1 ชิ้น"); return askSend(j, p0, { shop, due, ids }); }
      const x = jigById(j.id); if (!x) return;
      const sent = [];
      for (const pid of ids) {
        const p = partOf(x, pid), s = p && curStep(p);
        if (!s || s.op !== s0.op || s.state !== "wait") continue;
        partAdvance(x, p);
        s.shop = shop; s.due = due;
        sent.push(p);
      }
      log(x.id, `${o.send} ${sent.length} ชิ้น: ${shop}${due ? ` · กำหนดรับ ${fmtD(due)}` : ""} (${sent.map((p) => p.name).join(", ")})`);
      commit(`${o.send} ${sent.length} ชิ้น · ${shop}${due ? ` · รับ ${fmtD(due)}` : ""}`, { label: "เลิกทำ", fn: () => {
        const y = jigById(x.id); if (!y) return;
        for (const p0 of sent) {
          const p = partOf(y, p0.id), s = p && curStep(p);
          if (!s || s.op !== s0.op || s.state !== "doing") continue;
          partBack(y, p); delete s.shop; delete s.due;
        }
        commit(`${y.jigNo}: เลิกส่ง ${sent.length} ชิ้น`);
      } });
    } }],
    onCancel: () => render(true),
  });
}

/* ---------- นำเข้าไฟล์ CSV ของ Misumi: รหัสสินค้า + จำนวน ---------- */
async function readOrderFile(file) {
  const X = await loadXLSX();
  const buf = await file.arrayBuffer();
  let wb;
  if (/\.xlsx?$/i.test(file.name)) wb = X.read(buf, { type: "array" });
  else {
    // CSV จาก Excel ภาษาไทยมักเป็น Windows-874 ไม่ใช่ UTF-8
    let text;
    try { text = new TextDecoder("utf-8", { fatal: true }).decode(buf); } catch (e) { text = new TextDecoder("windows-874").decode(buf); }
    wb = X.read(text.replace(/^﻿/, ""), { type: "string", raw: true });
  }
  const rows = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "", raw: false });
  return parseOrderRows(rows);
}
function parseOrderRows(rows) {
  const isCode = (h) => /รหัส|part|product|item|model|code/i.test(h);
  const isQty = (h) => /จำนวน|qty|quantity/i.test(h);
  const hi = rows.findIndex((r) => r.some((c) => isCode(String(c))) && r.some((c) => isQty(String(c))));
  let ci, qi, start;
  if (hi >= 0) { ci = rows[hi].findIndex((c) => isCode(String(c))); qi = rows[hi].findIndex((c) => isQty(String(c))); start = hi + 1; }
  else { // ไม่มีหัวตาราง: No. | รหัส | จำนวน หรือ รหัส | จำนวน
    const wide = rows.some((r) => r.filter((c) => String(c).trim() !== "").length >= 3);
    [ci, qi, start] = wide ? [1, 2, 0] : [0, 1, 0];
  }
  const items = [];
  for (const r of rows.slice(start)) {
    const code = String(r[ci] ?? "").trim();
    if (!code) continue;
    const q = Number(String(r[qi] ?? "").replace(/,/g, "").trim());
    items.push({ code, qty: Number.isFinite(q) && q >= 1 ? Math.round(q) : null });
  }
  return items;
}
/* ---------- นำเข้า PDF "ใบยืนยันการสั่งซื้อสินค้า" ของ Misumi ----------
   แต่ละรายการมี 3 บรรทัด: (จำนวน PCS · ราคา) / (รหัสสินค้า · วันส่ง(วันรับ)) / (ชื่อสินค้า)
   ยึดบรรทัดวันที่ "dd/mm/yyyy(dd/mm)" เป็นหลัก แล้วหารหัสในบรรทัดเดียวกัน กับจำนวนในบรรทัดเหนือขึ้นไป */
let pdfjsP;
function loadPDFJS() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return (pdfjsP ||= loadScript("/vendor/pdfjs/pdf.min.js")
    .then(() => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "/vendor/pdfjs/pdf.worker.min.js"; return window.pdfjsLib; })
    .catch((e) => { pdfjsP = null; throw e; }));
}
const MIS_DATE = /^(\d{2})\/(\d{2})\/(\d{4})\((\d{2})\/(\d{2})\)$/;
async function readMisumiPdf(file) {
  const lib = await loadPDFJS();
  const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const items = [];
  let po = null;
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const h = page.getViewport({ scale: 1 }).height;
    const t = (await page.getTextContent()).items
      .filter((it) => it.str && it.str.trim())
      .map((it) => ({ s: it.str.trim(), x: it.transform[4], y: h - it.transform[5] }));
    const sameLine = (a, b) => Math.abs(a.y - b.y) < 4;
    if (!po) {
      const label = t.find((it) => /ใบสั่งซื้อ:?$/.test(it.s) && !/ลูกค้า|วันที่/.test(it.s));
      const right = label && t.filter((it) => sameLine(it, label) && it.x > label.x && /^[A-Z0-9]{6,}$/.test(it.s)).sort((a, b) => a.x - b.x)[0];
      po = right?.s || t.find((it) => /^FB[0-9A-Z]{6,}$/.test(it.s))?.s || null;
    }
    for (const d of t) {
      const m = MIS_DATE.exec(d.s.replace(/\s+/g, ""));
      if (!m) continue;
      const [, sd, sm, sy, rd, rm] = m.map(Number);
      // วันรับในวงเล็บไม่มีปี: ถ้าเดือนรับน้อยกว่าเดือนส่ง แปลว่าข้ามปี
      const ry = rm < sm ? sy + 1 : sy;
      const code = t.filter((it) => sameLine(it, d) && it.x < d.x && !/^0\d{5}$/.test(it.s) && /^[A-Za-z0-9][A-Za-z0-9.\-\/_]*$/.test(it.s))
        .sort((a, b) => a.x - b.x)[0];
      if (!code) continue;
      // จำนวน = ตัวเลขที่มีหน่วย (PCS ฯลฯ) ต่อท้าย ในบรรทัดเหนือรหัส
      const band = t.filter((it) => it.y < d.y - 3 && it.y > d.y - 26);
      let qty = null;
      for (const it of band) {
        const one = /^(\d[\d,]*)\s*[A-Za-z]{1,5}$/.exec(it.s);
        if (one) { qty = Number(one[1].replace(/,/g, "")); break; }
        if (/^\d[\d,]*$/.test(it.s) && band.some((u) => sameLine(u, it) && u.x > it.x && u.x - it.x < 40 && /^[A-Za-z]{1,5}$/.test(u.s))) { qty = Number(it.s.replace(/,/g, "")); break; }
      }
      items.push({ code: code.s, qty: qty >= 1 ? qty : null, ship: `${sy}-${pad(sm)}-${pad(sd)}`, due: `${ry}-${pad(rm)}-${pad(rd)}` });
    }
  }
  return { items, po };
}

  form.addEventListener("input", check); form.addEventListener("change", check);
  check();
}

let popFor = null;
function closePop() {
  const p = $("pop"); if (p.hidden) return;

  if (popFor) { popFor.setAttribute("aria-expanded", "false"); popFor.focus(); }
  popFor = null;
}
function openCardMenu(btn, j) {
  closePop();

  p.innerHTML = `<button role="menuitem" type="button" data-act="open" data-id="${j.id}">เปิดรายละเอียด</button>

}

/* ---------- คัดลอก: clipboard API ใช้ได้เฉพาะ https/localhost จึงมีทางสำรอง ---------- */
async function copyText(text, selectEl) {
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); return "ok"; } catch (e) {}
  }
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
  (document.querySelector("dialog[open]") || document.body).appendChild(ta);
  ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove();
  if (ok) return "ok";
  if (selectEl) { const rg = document.createRange(); rg.selectNodeContents(selectEl); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg); }
  return "manual";
}

    else if (a === "receive") { const o = S.orders.find((x) => x.id === el.dataset.oid); commit(setOrderStatus(o, "รับครบ") || `รับของแล้ว · ${fmtD(isoToday())}`); }
    else if (a === "addpart") {
      const name = $("dr-part").value.trim();
      if (!name) { $("dr-part").focus(); return; }
      const preset = PRESETS.find((x) => x.id === $("dr-preset").value) || PRESETS[0];
      j.parts.push({ id: `${j.id}-P${Date.now().toString(36)}`, name, spec: "", steps: preset.route.map((op) => ({ op, state: "wait", start: null, end: null })) });
      log(j.id, `เพิ่มชิ้นส่วน ${name} (${preset.label})`);
      commit(`เพิ่มชิ้นส่วน ${name} แล้ว`);
      $("dr-preset").value = preset.id; $("dr-part").focus();
    }
    else if (a === "addorder") { ui.prefJig = j.id; ui.drawer = null; setView("orders"); render(); $("o-what").focus(); }
    else if (a === "dobackup") doBackup();
    else if (a === "copytable") copyTable();
    else if (a === "dorestore") {
      if (!ui.restore || !ui.canAdmin || ui.conn !== "live") return;
      const data = ui.restore;
      ui.restore = null; ui.drawer = null; ui.cust = ""; ui.open.clear();
      // ประวัติจากไฟล์แทนที่เอกสารประวัติเดิมทั้งหมด จัดกลุ่มใหม่ตามชุด
      for (const id of effective("logs").keys()) enqueue(`logs/${id}`, null);
      const byJig = new Map();
      for (const l of data.logs) { if (!byJig.has(l.jigId)) byJig.set(l.jigId, []); byJig.get(l.jigId).push({ at: l.at, text: l.text, src: l.src, by: l.by || "" }); }
      for (const [jigId, entries] of byJig) enqueue(`logs/${jigId}~restore`, { jigId, writer: "restore", entries });
      S = { jigs: data.jigs, orders: data.orders, logs: [] }; pendingLog = [];
      log(S.jigs[0].id, "กู้ข้อมูลจากไฟล์สำรอง");
      refreshCustOptions(); commit(`กู้ข้อมูลแล้ว · ${S.jigs.length} ชุด`);
    }
    return;
  }
  const tab = e.target.closest(".tab, .tab-link");
  if (tab) { setView(tab.dataset.view); closeTools(); render(); }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("pop").hidden) { closePop(); return; }
  if (e.key === "Escape" && document.querySelector("dialog[open]")) return; // dialog ปิดเอง
  if (e.key === "Escape" && ui.drawer) { ui.drawer = null; render(); }
  if (e.key === "Tab" && !$("drawer").hidden && !document.querySelector("dialog[open]")) trapFocus(e, $("drawer"));
  if ((e.key === "ArrowDown" || e.key === "ArrowUp") && !$("pop").hidden) {
    const items = [...$("pop").querySelectorAll("button")], i = items.indexOf(document.activeElement);
    items[(i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length]?.focus(); e.preventDefault();
  }
  if ((e.key === "ArrowRight" || e.key === "ArrowLeft" || e.key === "ArrowDown" || e.key === "ArrowUp") && e.target.matches?.('[role="tab"]')) {
    const list = [...e.target.parentElement.querySelectorAll('[role="tab"]')], i = list.indexOf(e.target);
    const nx = list[(i + (e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : -1) + list.length) % list.length];
    nx.focus(); nx.click(); e.preventDefault();
  }

});

async function saveUser(payload) {
  const u = ui.users.find((x) => x.username === payload.username);
  try {
    const res = await apiFetch("/api/users", { method: "POST", body: JSON.stringify({ name: u?.name, role: u?.role, active: !!(u ? u.active : 1), ...payload }) });
    ui.newPw = res.password ? { user: payload.username, pw: res.password } : null;
  } catch (err) { toast(err.message || "บันทึกผู้ใช้ไม่สำเร็จ"); }
  await loadUsers(); keepScroll(renderUserPanel);
}

// drag & drop ของการ์ดชุดบน Kanban
let dragId = null;
const kb = $("view-kanban");
kb.addEventListener("dragstart", (e) => {
  const c = e.target.closest(".card[draggable='true']"); if (!c || ui.readOnly) return;
  dragId = c.dataset.id; c.classList.add("dragging");
  try { e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed = "move"; } catch (err) {}
});
kb.addEventListener("dragend", (e) => { e.target.closest?.(".card")?.classList.remove("dragging"); kb.querySelectorAll(".lane.over").forEach((l) => l.classList.remove("over")); dragId = null; });
kb.addEventListener("dragover", (e) => {
  const lane = e.target.closest(".lane"); if (!lane || !dragId || SIDX[lane.dataset.stage] == null) return;
  e.preventDefault();
  kb.querySelectorAll(".lane.over").forEach((l) => l !== lane && l.classList.remove("over"));
  lane.classList.add("over");
});
kb.addEventListener("drop", (e) => {
  const lane = e.target.closest(".lane"); if (!lane || !dragId || SIDX[lane.dataset.stage] == null) return;
  e.preventDefault();
  const j = jigById(dragId); dragId = null;
  if (j.stage !== lane.dataset.stage) requestStage(j, lane.dataset.stage, "drag");
  else render();
});
